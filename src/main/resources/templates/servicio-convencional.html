<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

</head>
<body class="bg-[#f4f6fa] min-h-screen flex flex-col justify-between p-8" style="font-family: 'Inter', sans-serif;">

<div class="w-full max-w-6xl mx-auto relative flex items-center justify-between px-4 mb-6">
  <div class="z-10">
    <img src="/logo2.png" alt="SU Logo" class="h-10 object-contain">
  </div>

  <div class="md:absolute md:left-1/2 md:-translate-x-1/2 flex items-center space-x-4">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
        <span class="material-symbols-outlined text-[16px]">check</span>
      </div>
      <span class="text-xs font-bold text-green-600">Servicio</span>
    </div>
    <div class="w-12 h-0.5 bg-green-200"></div>

    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-[#0a369d] text-white flex items-center justify-center text-xs font-bold shadow-sm">2</div>
      <span class="text-xs font-bold text-[#0a369d]">Detalles</span>
    </div>
    <div class="w-12 h-0.5 bg-gray-200"></div>

    <div class="flex items-center space-x-2 opacity-40">

      <span class="text-xs font-semibold text-gray-400">Cliente</span>
    </div>
    <div class="w-12 h-0.5 bg-gray-200"></div>

    <div class="flex items-center space-x-2 opacity-40">
      <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 text-gray-400 flex items-center justify-center text-xs font-bold">4</div>
      <span class="text-xs font-semibold text-gray-400">Ticket</span>
    </div>
  </div>
  <div class="hidden md:block w-10"></div>

<div class="max-w-5xl mx-auto w-full text-center my-auto px-4">
  <h1 class="text-xl font-bold text-gray-500 tracking-tight">Selecciona el tipo de ropa que deseas lavar</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con1.png" class="max-h-32 object-contain" alt="Ropa Casual">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('casual', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-casual">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('casual', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con2.png" class="max-h-32 object-contain" alt="Ropa Interior">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('interior', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-interior">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('interior', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con3.png" class="max-h-32 object-contain" alt="Camisetas">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('playeras', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-playeras">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('playeras', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con4.png" class="max-h-32 object-contain" alt="Jeans">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('jeans', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-jeans">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('jeans', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con5.png" class="max-h-32 object-contain" alt="Sudaderas">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('sudaderas', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-sudaderas">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('sudaderas', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
      <div class="h-36 flex items-center justify-center">
        <img src="/con6.png" class="max-h-32 object-contain" alt="Deportiva">
      </div>
      <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
        <button type="button" onclick="cambiarCantidad('deportiva', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">add</span>
        </button>
        <span class="text-sm font-bold text-gray-800"><span id="cant-deportiva">0</span> piezas</span>
        <button type="button" onclick="cambiarCantidad('deportiva', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
          <span class="material-symbols-outlined text-[18px]">remove</span>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- CORREGIDO: Se quitó el "action" y el "method" para que no intente buscar un HTML inexistente -->
<div class="w-full max-w-5xl mx-auto flex items-center justify-between pt-6 border-t border-gray-200/60 mt-6">
  <a href="/servicios" class="inline-flex items-center space-x-2 border border-gray-300 bg-white text-gray-600 px-6 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-50 transition shadow-xs">
    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
    <span>Volver</span>
  </a>

  <div class="bg-white rounded-2xl border border-gray-200 p-1.5 flex items-center space-x-1 shadow-xs shrink-0">
    <label class="flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition select-none has-[:checked]:bg-blue-50 has-[:checked]:text-[#0a369d] text-gray-500">
      <input type="radio" name="modalidad_ui" value="compartido" checked class="hidden" onchange="actualizarModalidad('compartido')">
      <span class="material-symbols-outlined text-[16px]">group</span>
      <span>Compartido</span>
    </label>

    <label class="flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition select-none has-[:checked]:bg-[#0a369d] has-[:checked]:text-white text-gray-500">
      <input type="radio" name="modalidad_ui" value="exclusivo" class="hidden" onchange="actualizarModalidad('exclusivo')">
      <span class="material-symbols-outlined text-[16px]">lock</span>
      <span>Exclusivo</span>
    </label>
  </div>

  <div class="bg-white rounded-2xl border border-gray-200 px-8 py-3 flex items-center space-x-8 text-left shadow-xs">
    <div class="flex items-center space-x-3 pr-8 border-r border-gray-100">
      <span class="material-symbols-outlined text-blue-600 text-[26px]">checkroom</span>
      <div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total seleccionado</p>
        <p class="text-sm font-extrabold text-blue-600"><span id="resumen-piezas">0</span> piezas</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Peso estimado</p>
        <p class="text-sm font-extrabold text-blue-600"><span id="resumen-peso">0.0</span> kg</p>
      </div>
    </div>
  </div>

  <!-- CORREGIDO: Ahora ejecuta la función 'irAContacto()' mediante un botón normal -->
  <button type="button" onclick="irAContacto()" class="inline-flex items-center space-x-2 bg-[#0066ff] text-white px-6 py-2.5 rounded-xl text-xs font-bold hover:bg-[#0052cc] transition shadow-xs cursor-pointer">
    <span>Continuar</span>
    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
  </button>
</div>

<script>
  const pesosPrenda = {
    casual: 0.25,
    interior: 0.1,
    playeras: 0.2,
    jeans: 0.5,
    sudaderas: 0.6,
    deportiva: 0.25
  };

  const cantidades = {
    casual: 0,
    interior: 0,
    playeras: 0,
    jeans: 0,
    sudaderas: 0,
    deportiva: 0
  };

  let modalidadSeleccionada = "compartido";

  function cambiarCantidad(prenda, cambio) {
    let nuevaCantidad = cantidades[prenda] + cambio;
    if (nuevaCantidad < 0) nuevaCantidad = 0;

    cantidades[prenda] = nuevaCantidad;
    document.getElementById(`cant-${prenda}`).innerText = nuevaCantidad;
    actualizarResumen();
  }

  function actualizarModalidad(valor) {
    modalidadSeleccionada = valor;
  }

  function actualizarResumen() {
    let totalPiezas = 0;
    let totalPeso = 0;

    for (const prenda in cantidades) {
      totalPiezas += cantidades[prenda];
      totalPeso += cantidades[prenda] * pesosPrenda[prenda];
    }

    document.getElementById('resumen-piezas').innerText = totalPiezas;
    document.getElementById('resumen-peso').innerText = totalPeso.toFixed(1);
  }

  // NUEVA FUNCIÓN: Redirige directamente al paso 3 sin pasar por Java
  function irAContacto() {
    // Calculamos el total de piezas actual
    let totalPiezas = 0;
    for (const prenda in cantidades) {
      totalPiezas += cantidades[prenda];
    }

    // Si no seleccionó nada, avisamos (opcional)
    if (totalPiezas === 0) {
      alert("Por favor selecciona al menos 1 prenda.");
      return;
    }

    // Guardamos las piezas en la memoria del navegador
    localStorage.setItem("totalPiezasSeleccionadas", totalPiezas);

    // Redirigimos a la siguiente pantalla
    window.location.href = "/datos-contacto";
  }
</script>

</body>
</html>
