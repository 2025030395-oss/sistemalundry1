<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Lavandería - Nuevo Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#f4f6fa] flex h-screen text-gray-800 overflow-hidden" style="font-family: 'Inter', sans-serif;">

<div class="w-64 bg-[#0a369d] text-white flex flex-col justify-between shadow-lg shrink-0">
    <div>
        <div class="h-16 bg-[#041231] flex items-center justify-center">
            <img src="/sulaundry.jpeg" alt="SU Laundry Logo" class="h-full w-full object-cover">
        </div>

        <nav class="mt-6 px-4 space-y-2">
            <a th:href="@{/index}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span>Inicio</span>
            </a>
            <a th:href="@{/pedidos}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                <span>Pedidos</span>
            </a>
            <a th:href="@{/clientes}" class="flex items-center space-x-3 bg-[#cbdcf7] text-[#0a369d] py-3 px-4 rounded-xl font-semibold shadow-xs">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span>Clientes</span>
            </a>
            <a th:href="@{/inventario}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="box" class="w-5 h-5"></i>
                <span>Inventario</span>
            </a>
            <a th:href="@{/caja}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                <span>Caja</span>
            </a>
            <a th:href="@{/reportes}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                <span>Reportes</span>
            </a>
            <a th:href="@{/perfil}" class="flex items-center space-x-3 text-white/80 hover:bg-white/10 hover:text-white py-3 px-4 rounded-xl transition font-medium">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <div class="p-4 border-t border-white/10 text-xs text-white/60">
        Sesión: Paulina Martínez
    </div>
</div>

<div class="flex-1 flex flex-col h-screen overflow-y-auto">

    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Clientes</h1>
            <p class="text-xs text-gray-500">Gestiona la información de tus clientes</p>
        </div>

        <div class="flex items-center space-x-6">
            <div class="relative">
                <input type="text" placeholder="Buscar orden, cliente, prenda..."
                       class="w-64 bg-gray-100 text-sm py-2 pl-4 pr-10 rounded-lg border border-transparent focus:outline-hidden focus:bg-white focus:border-gray-300 transition">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute right-3 top-2.5"></i>
            </div>

            <div class="relative border-l border-gray-200 pl-6">
                <button id="btn-usuario-menu" class="flex items-center space-x-3 text-left cursor-pointer hover:opacity-80 transition focus:outline-hidden">
                    <div class="w-9 h-9 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 font-bold shrink-0">
                        PM
                    </div>
                    <div class="leading-tight">
                        <p class="text-sm font-semibold text-gray-700">Paulina Martínez</p>
                        <p class="text-xs text-gray-400">Administradora</p>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 ml-1"></i>
                </button>

                <div id="menu-usuario-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-xl border border-gray-100 shadow-xl py-2 z-50 hidden opacity-0 transition-all duration-200 origin-top-right transform scale-95">
                    <a th:href="@{/perfil}" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition">
                        <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
                        <span>Mi Perfil</span>
                    </a>
                    <button class="w-full flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition cursor-pointer text-left">
                        <i data-lucide="users" class="w-4 h-4 text-gray-400"></i>
                        <span>Cambiar de cuenta</span>
                    </button>
                    <hr class="border-gray-100 my-1">
                    <button class="w-full flex items-center space-x-2.5 px-4 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50/50 transition cursor-pointer text-left">
                        <i data-lucide="log-out" class="w-4 h-4 text-red-500"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="p-8 flex-1">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Nuevo cliente</h2>
            <p class="text-sm text-gray-500 mt-1">Completa la información para registrar un nuevo cliente.</p>
        </div>

        <div class="flex gap-6 items-start">
            <div class="flex-1 bg-white rounded-2xl border border-gray-100 shadow-xs p-10">
                <form id="form-nuevo-cliente" th:action="@{/clientes/guardar}" method="POST" class="space-y-8">

                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-6">Información del cliente</h3>
                        <div class="grid grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-900">Nombre completo*</label>
                                <input type="text" name="nombre" required placeholder="Ej. Ana Martinez Ruiz"
                                       class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-hidden focus:bg-white focus:border-gray-300 transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-900">Teléfono *</label>
                                <input type="text" name="telefono" required placeholder="Ej. 6691144261"
                                       class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-hidden focus:bg-white focus:border-gray-300 transition">
                            </div>
                            <div class="col-span-2 space-y-2 max-w-md">
                                <label class="text-sm font-bold text-gray-900">Correo electrónico</label>
                                <input type="email" name="correo" placeholder="Ej. ana@email.com"
                                       class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-hidden focus:bg-white focus:border-gray-300 transition">
                            </div>
                        </div>
                    </section>

                    <hr class="border-gray-100">

                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-6">Dirección</h3>
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-gray-900">Calle y número</label>
                            <input type="text" name="direccion" placeholder="Ej. AV. Insurgente Sur"
                                   class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm focus:outline-hidden focus:bg-white focus:border-gray-300 transition">
                        </div>
                    </section>
                </form>
            </div>

            <div class="w-64 flex flex-col space-y-4 shrink-0">
                <button type="submit" form="form-nuevo-cliente" class="w-full bg-[#0052ff] hover:bg-[#0044d6] text-white py-3 px-4 rounded-xl font-semibold shadow-md transition flex items-center justify-center space-x-2 cursor-pointer">
                    <i data-lucide="folder" class="w-5 h-5"></i>
                    <span>Guardar cliente</span>
                </button>

                <a th:href="@{/clientes}" class="w-full bg-white hover:bg-gray-50 text-[#0052ff] py-3 px-4 rounded-xl font-semibold border border-[#0052ff] transition flex items-center justify-center space-x-2 cursor-pointer text-center">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                    <span>Cancelar</span>
                </a>
            </div>
        </div>
    </main>
</div>

<script>
    lucide.createIcons();

    // SCRIPT DE CONTROL PARA EL MENÚ DEL PERFIL (DROPDOWN)
    const btnUsuarioMenu = document.getElementById('btn-usuario-menu');
    const menuUsuarioDropdown = document.getElementById('menu-usuario-dropdown');

    if (btnUsuarioMenu && menuUsuarioDropdown) {
        btnUsuarioMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = menuUsuarioDropdown.classList.contains('hidden');

            if (isHidden) {
                menuUsuarioDropdown.classList.remove('hidden');
                setTimeout(() => {
                    menuUsuarioDropdown.classList.remove('opacity-0', 'scale-95');
                    menuUsuarioDropdown.classList.add('opacity-100', 'scale-100');
                }, 10);
            } else {
                ocultarDropdownUsuario();
            }
        });

        function ocultarDropdownUsuario() {
            menuUsuarioDropdown.classList.remove('opacity-100', 'scale-100');
            menuUsuarioDropdown.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                menuUsuarioDropdown.classList.add('hidden');
            }, 200);
        }

        document.addEventListener('click', (e) => {
            if (!menuUsuarioDropdown.contains(e.target) && !btnUsuarioMenu.contains(e.target)) {
                ocultarDropdownUsuario();
            }
        });
    }
</script>
</body>
</html>
