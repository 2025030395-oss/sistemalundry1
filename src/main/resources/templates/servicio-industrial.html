<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Servicio Industrial - SU Laundry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f4f6fa] min-h-screen flex flex-col justify-between p-8" style="font-family: 'Inter', sans-serif;">

<div class="w-full max-w-6xl mx-auto block shrink-0 mb-6">
    <div class="flex items-center justify-between px-4 relative">
        <div class="z-10">
            <img th:src="@{/logo2.png}" alt="SU Logo" class="h-10 object-contain">
        </div>

        <div class="md:absolute md:left-1/2 md:-translate-x-1/2 flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
                    <span class="material-symbols-outlined text-[16px]">check</span>
                </div>
                <span class="text-xs font-bold text-green-600">Servicio</span>
            </div>
            <div class="w-12 h-0.5 bg-green-200"></div>

            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-[#0a369d] text-white flex items-center justify-center text-xs font-bold shadow-sm">2</div>
                <span class="text-xs font-bold text-[#0a369d]">Detalles</span>
            </div>
            <div class="w-12 h-0.5 bg-gray-200"></div>

            <div class="flex items-center space-x-2 opacity-40">
                <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 text-gray-400 flex items-center justify-center text-xs font-bold">3</div>
                <span class="text-xs font-semibold text-gray-400">Cliente</span>
            </div>
            <div class="w-12 h-0.5 bg-gray-200"></div>

            <div class="flex items-center space-x-2 opacity-40">
                <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 text-gray-400 flex items-center justify-center text-xs font-bold">4</div>
                <span class="text-xs font-semibold text-gray-400">Ticket</span>
            </div>
        </div>
        <div class="hidden md:block w-10"></div>
    </div>
</div>

<div class="max-w-5xl mx-auto w-full flex-1 flex flex-col justify-center my-auto px-4">
    <h1 class="text-xl font-bold text-gray-500 tracking-tight text-center">Selecciona el tipo de ropa que deseas lavar</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind1.png}" class="max-h-32 object-contain" alt="Toallas">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('toallas', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-toallas">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('toallas', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind2.png}" class="max-h-32 object-contain" alt="Manteles">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('manteles', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-manteles">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('manteles', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind3.png}" class="max-h-32 object-contain" alt="Overoles">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('overoles', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-overoles">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('overoles', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind8.png}" class="max-h-32 object-contain" alt="Edredones">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('edredones', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-edredones">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('edredones', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind7.png}" class="max-h-32 object-contain" alt="Batas">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('batas', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-batas">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('batas', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs p-5 flex flex-col items-center justify-between space-y-4">
            <div class="h-36 flex items-center justify-center">
                <img th:src="@{/ind6.png}" class="max-h-32 object-contain" alt="Chefs">
            </div>
            <div class="flex items-center justify-between w-full bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">
                <button type="button" onclick="cambiarCantidad('chefs', 1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
                <span class="text-sm font-bold text-gray-800"><span id="cant-chefs">0</span> piezas</span>
                <button type="button" onclick="cambiarCantidad('chefs', -1)" class="w-8 h-8 bg-[#0066ff] text-white rounded-full flex items-center justify-center shadow-xs cursor-pointer hover:bg-[#0052cc] transition">
                    <span class="material-symbols-outlined text-[18px]">remove</span>
                </button>
            </div>
        </div>

    </div>
</div>

<div class="w-full max-w-5xl mx-auto flex items-center justify-between pt-6 border-t border-gray-200/60 mt-6 shrink-0">
    <a th:href="@{/servicios}" class="inline-flex items-center space-x-2 border border-gray-300 bg-white text-gray-600 px-6 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-50 transition shadow-xs">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>Volver</span>
    </a>

    <div class="bg-white rounded-2xl border border-gray-200 p-1.5 flex items-center space-x-1 shadow-xs shrink-0">
        <label class="flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition select-none has-[:checked]:bg-blue-50 has-[:checked]:text-[#0a369d] text-gray-500">
            <input type="radio" name="modalidad_ui" value="compartido" checked class="hidden" onchange="actualizarModalidad('compartido')">
            <span class="material-symbols-outlined text-[16px]">group</span>
            <span>Compartido</span>
        </label>

        <label class="flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer transition select-none has-[:checked]:bg-[#0a369d] has-[:checked]:text-white text-gray-500">
            <input type="radio" name="modalidad_ui" value="exclusivo" class="hidden" onchange="actualizarModalidad('exclusivo')">
            <span class="material-symbols-outlined text-[16px]">lock</span>
            <span>Exclusivo</span>
        </label>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 px-8 py-3 flex items-center space-x-8 text-left shadow-xs">
        <div class="flex items-center space-x-3 pr-8 border-r border-gray-100">
            <span class="material-symbols-outlined text-blue-600 text-[26px]">checkroom</span>
            <div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total seleccionado</p>
                <p class="text-sm font-extrabold text-blue-600"><span id="resumen-piezas">0</span> piezas</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Peso estimado</p>
                <p class="text-sm font-extrabold text-blue-600"><span id="resumen-peso">0.0</span> kg</p>
            </div>
        </div>
    </div>

    <button type="button" onclick="irAContacto()" class="inline-flex items-center space-x-2 bg-[#0066ff] text-white px-6 py-2.5 rounded-xl text-xs font-bold hover:bg-[#0052cc] transition shadow-xs cursor-pointer">
        <span>Continuar</span>
        <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
    </button>
</div>

<script>
    const pesosPrenda = {
        toallas: 0.4,
        manteles: 0.6,
        overoles: 0.8,
        edredones: 2.5,
        batas: 0.5,
        chefs: 0.5
    };

    const cantidades = {
        toallas: 0,
        manteles: 0,
        overoles: 0,
        edredones: 0,
        batas: 0,
        chefs: 0
    };

    let modalidadSeleccionada = "compartido";

    function cambiarCantidad(prenda, cambio) {
        let nuevaCantidad = cantidades[prenda] + cambio;
        if (nuevaCantidad < 0) nuevaCantidad = 0;

        cantidades[prenda] = nuevaCantidad;
        document.getElementById(`cant-${prenda}`).innerText = nuevaCantidad;
        actualizarResumen();
    }

    function actualizarModalidad(valor) {
        modalidadSeleccionada = valor;
    }

    function actualizarResumen() {
        let totalPiezas = 0;
        let totalPeso = 0;

        for (const prenda in cantidades) {
            totalPiezas += cantidades[prenda];
            totalPeso += cantidades[prenda] * pesosPrenda[prenda];
        }

        document.getElementById('resumen-piezas').innerText = totalPiezas;
        document.getElementById('resumen-peso').innerText = totalPeso.toFixed(1);
    }

    function irAContacto() {
        // Calculamos el total de piezas actual
        let totalPiezas = 0;
        for (const prenda in cantidades) {
            totalPiezas += cantidades[prenda];
        }

        // Si no seleccionó nada, avisamos (opcional)
        if (totalPiezas === 0) {
            alert("Por favor selecciona al menos 1 prenda.");
            return;
        }

        // Guardamos las piezas en la memoria del navegador
        localStorage.setItem("totalPiezasSeleccionadas", totalPiezas);

        // Redirigimos a la siguiente pantalla
        window.location.href = "/datos-contacto";
    }
</script>

</body>
</html>
