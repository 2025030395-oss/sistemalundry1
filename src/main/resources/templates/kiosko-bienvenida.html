<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SU Laundry - Kiosco</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .kiosco-container { display: flex; height: 100vh; width: 100vw; background-color: #f4f6f9; }

        /* Contenedor izquierdo con ancho fijo del 40% */
        .left-banner {
            width: 40%;
            height: 100vh;
            display: block;
        }
        .left-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que la imagen llene el espacio sin deformarse */
        }

        .right-content { width: 60%; display: flex; justify-content: center; align-items: center; padding: 40px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 480px; text-align: center; }
        h2 { font-size: 28px; margin-bottom: 8px; color: #111; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: #1771f1; color: white; border: none; }
        .btn-primary:hover { background-color: #0b49b3; }
        .btn-secondary { background-color: white; color: #333; border: 1px solid #e0e0e0; }
        .btn-secondary:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="kiosco-container">
    <div class="left-banner">
        <img th:src="@{/log.jpeg}" alt="SU Laundry Banner">
    </div>

    <div class="right-content">
        <div class="card">
            <h2>Bienvenido</h2>
            <p>¿Qué deseas hacer hoy?</p>
            <a href="/servicios" class="btn btn-primary">Iniciar nuevo pedido</a>
            <a href="/kiosco/rastrear" class="btn btn-secondary">Consultar tu pedido</a>
        </div>
    </div>
</div>
</body>
</html>
