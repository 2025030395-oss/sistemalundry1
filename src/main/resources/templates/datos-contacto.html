<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Contacto - SU Laundry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f4f6fa] min-h-screen flex flex-col justify-between p-8 relative" style="font-family: 'Inter', sans-serif;">

<!-- FORMULARIO PRINCIPAL PARA ENVIAR A SPRING BOOT -->
<form id="form-contacto" th:action="@{/tu-pedido}" method="POST" class="min-h-screen flex flex-col justify-between w-full">
    <!-- INPUTS OCULTOS PARA SPRING BOOT -->
    <input type="hidden" id="input-total-piezas" name="totalPiezas" value="0">
    <input type="hidden" id="input-id-cliente-hidden" name="idCliente" value="">

    <div class="w-full max-w-6xl mx-auto relative flex items-center justify-between px-4 mb-6">
        <div class="z-10">
            <img th:src="@{/logo2.png}" src="/logo2.png" alt="SU Logo" class="h-10 object-contain">
        </div>

        <div class="md:absolute md:left-1/2 md:-translate-x-1/2 flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
                    <span class="material-symbols-outlined text-[16px]">check</span>
                </div>
                <span class="text-xs font-bold text-green-600">Servicio</span>
            </div>
            <div class="w-12 h-0.5 bg-green-200"></div>

            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-green-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
                    <span class="material-symbols-outlined text-[16px]">check</span>
                </div>
                <span class="text-xs font-bold text-green-600">Detalles</span>
            </div>
            <div class="w-12 h-0.5 bg-green-200"></div>

            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-[#0a369d] text-white flex items-center justify-center text-xs font-bold shadow-sm">3</div>
                <span class="text-xs font-bold text-[#0a369d]">Cliente</span>
            </div>
            <div class="w-12 h-0.5 bg-gray-200"></div>

            <div class="flex items-center space-x-2 opacity-40">
                <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 text-gray-400 flex items-center justify-center text-xs font-bold">4</div>
                <span class="text-xs font-semibold text-gray-400">Ticket</span>
            </div>
        </div>
        <div class="hidden md:block w-10"></div>
    </div>

    <div class="max-w-xl mx-auto w-full text-center my-auto px-4">
        <div class="mb-6">
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">Datos del contacto</h1>
            <p class="text-gray-500 text-sm mt-2 font-medium">Por favor ingresa tus datos.</p>
        </div>

        <div id="alerta-campos" class="hidden mb-6 bg-red-50 border border-red-200 text-red-600 p-4 rounded-2xl flex items-center space-x-3 text-left transition duration-300">
            <span class="material-symbols-outlined text-red-500">error</span>
            <span class="text-xs font-bold">Por favor, rellena todos los campos vacíos antes de continuar.</span>
        </div>

        <div class="flex justify-center mb-10">
            <div class="w-24 h-24 bg-[#cbdcf7] rounded-full flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-[#0a369d] text-[50px]">person</span>
            </div>
        </div>

        <div class="space-y-6 text-left">
            <div>
                <label class="block text-sm font-bold text-gray-800 mb-2 ml-1">Nombre completo</label>
                <input type="text" id="input-nombre" name="nombreCliente" placeholder="Escribe tu nombre"
                       class="w-full bg-white border border-gray-200 rounded-2xl py-4 px-6 text-sm focus:outline-hidden focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition shadow-xs font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-800 mb-2 ml-1">Teléfono</label>
                <input type="tel" id="input-telefono" name="telefonoCliente" placeholder="Escribe tu número de telefono"
                       class="w-full bg-white border border-gray-200 rounded-2xl py-4 px-6 text-sm focus:outline-hidden focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition shadow-xs font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-800 mb-4 ml-1 tracking-tight">¿Eres usuario nuevo?</label>
                <div id="contenedor-tipo-usuario" class="grid grid-cols-2 gap-4 p-0.5 rounded-2xl transition duration-200">
                    <button type="button" id="opcion-nuevo" onclick="seleccionarUsuario('nuevo')" class="bg-white border-2 border-gray-100 py-4 px-2 rounded-2xl text-sm font-bold text-gray-500 hover:bg-gray-50 transition shadow-xs cursor-pointer">
                        Si, soy usuario nuevo
                    </button>
                    <button type="button" id="opcion-id" onclick="seleccionarUsuario('id')" class="bg-white border-2 border-gray-100 py-4 px-2 rounded-2xl text-sm font-bold text-gray-500 hover:bg-gray-50 transition shadow-xs cursor-pointer">
                        No, ya tengo un ID
                    </button>
                </div>
            </div>

            <div id="seccion-id-existente" class="hidden transition-all duration-300">
                <label class="block text-sm font-bold text-gray-800 mb-2 ml-1">Ingresa tu ID de Cliente</label>
                <input type="text" id="input-id-existente" placeholder="Ejemplo: 20250304"
                       class="w-full bg-white border border-gray-200 rounded-2xl py-4 px-6 text-sm focus:outline-hidden focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition shadow-xs font-medium">
            </div>
        </div>
    </div>

    <div class="w-full max-w-6xl mx-auto flex items-center justify-between pt-6 border-t border-gray-200/60">
        <a th:href="@{/servicios}" href="/servicios" class="inline-flex items-center space-x-2 border border-gray-300 bg-white text-gray-600 px-6 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-50 transition shadow-xs">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            <span>Volver</span>
        </a>

        <button type="button" onclick="validarYContinuar()" class="inline-flex items-center space-x-2 bg-[#0066ff] text-white px-8 py-3 rounded-xl text-xs font-bold hover:bg-[#0052cc] transition shadow-xs cursor-pointer">
            <span>Continuar</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
    </div>

</form>

<script>
    let tipoUsuarioSeleccionado = null;

    document.addEventListener('DOMContentLoaded', () => {
        // Carga de datos guardados previamente en el cliente
        const nombreLocal = localStorage.getItem('nombreCliente');
        const telLocal = localStorage.getItem('telefonoCliente');
        if (nombreLocal) document.getElementById('input-nombre').value = nombreLocal;
        if (telLocal) document.getElementById('input-telefono').value = telLocal;

        // RECUPERAR PIEZAS DESDE LOCALSTORAGE Y ASIGNAR AL INPUT OCULTO
        const piezasSeleccionadas = localStorage.getItem('totalPiezasSeleccionadas');
        if (piezasSeleccionadas) {
            document.getElementById('input-total-piezas').value = piezasSeleccionadas;
        }
    });

    function seleccionarUsuario(tipo) {
        tipoUsuarioSeleccionado = tipo;
        const btnNuevo = document.getElementById('opcion-nuevo');
        const btnId = document.getElementById('opcion-id');
        const contenedorTipo = document.getElementById('contenedor-tipo-usuario');
        const seccionId = document.getElementById('seccion-id-existente');

        contenedorTipo.classList.remove('ring-4', 'ring-red-500/10', 'border-red-500');

        [btnNuevo, btnId].forEach(btn => {
            btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
            btn.classList.add('border-gray-100', 'bg-white', 'text-gray-500');
        });

        if (tipo === 'nuevo') {
            btnNuevo.classList.remove('border-gray-100', 'bg-white', 'text-gray-500');
            btnNuevo.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
            seccionId.classList.add('hidden');
            document.getElementById('input-id-existente').value = "";
        } else {
            btnId.classList.remove('border-gray-100', 'bg-white', 'text-gray-500');
            btnId.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
            seccionId.classList.remove('hidden');
        }
    }

    function validarYContinuar() {
        const inputNombre = document.getElementById('input-nombre');
        const inputTelefono = document.getElementById('input-telefono');
        const inputIdExistente = document.getElementById('input-id-existente');
        const contenedorTipo = document.getElementById('contenedor-tipo-usuario');
        const alerta = document.getElementById('alerta-campos');

        let formularioValido = true;

        if (inputNombre.value.trim() === "") {
            inputNombre.classList.add('border-red-500', 'ring-4', 'ring-red-500/10');
            formularioValido = false;
        }
        if (inputTelefono.value.trim() === "") {
            inputTelefono.classList.add('border-red-500', 'ring-4', 'ring-red-500/10');
            formularioValido = false;
        }
        if (tipoUsuarioSeleccionado === null) {
            contenedorTipo.classList.add('ring-4', 'ring-red-500/10', 'border', 'border-red-500');
            formularioValido = false;
        }
        if (tipoUsuarioSeleccionado === 'id' && inputIdExistente.value.trim() === "") {
            inputIdExistente.classList.add('border-red-500', 'ring-4', 'ring-red-500/10');
            formularioValido = false;
        }

        if (!formularioValido) {
            alerta.classList.remove('hidden');
        } else {
            alerta.classList.add('hidden');

            let idFinal = "";
            if (tipoUsuarioSeleccionado === 'nuevo') {
                idFinal = "SU-" + Math.floor(100000 + Math.random() * 900000);
            } else {
                idFinal = inputIdExistente.value.trim();
            }

            // Asignar ID generado o ingresado al input hidden para el backend
            document.getElementById('input-id-cliente-hidden').value = idFinal;

            localStorage.setItem('nombreCliente', inputNombre.value.trim());
            localStorage.setItem('telefonoCliente', inputTelefono.value.trim());
            localStorage.setItem('idCliente', idFinal);

            // ENVIAR EL FORMULARIO COMPLETO A SPRING BOOT
            document.getElementById('form-contacto').submit();
        }
    }

    document.getElementById('input-nombre').addEventListener('input', function() { this.classList.remove('border-red-500', 'ring-4', 'ring-red-500/10'); });
    document.getElementById('input-telefono').addEventListener('input', function() { this.classList.remove('border-red-500', 'ring-4', 'ring-red-500/10'); });
    document.getElementById('input-id-existente').addEventListener('input', function() { this.classList.remove('border-red-500', 'ring-4', 'ring-red-500/10'); });
</script>
</body>
</html>
