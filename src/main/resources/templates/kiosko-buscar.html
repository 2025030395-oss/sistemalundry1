<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SU Laundry - Buscar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    .kiosco-container { display: flex; height: 100vh; width: 100vw; background-color: #f4f6f9; }

    .left-banner {
      width: 40%;
      height: 100vh;
      display: block;
    }
    .left-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .right-content { width: 60%; display: flex; justify-content: center; align-items: center; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 480px; }
    h2 { font-size: 24px; margin-bottom: 8px; color: #111; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    .input-group { position: relative; margin-bottom: 25px; }
    .input-group input { width: 100%; padding: 14px 14px 14px 40px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    .input-icon { position: absolute; left: 14px; top: 16px; color: #888; }
    .btn-group { display: flex; gap: 15px; }
    .btn { flex: 1; padding: 14px; border-radius: 6px; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
    .btn-submit { background-color: #1771f1; color: white; border: none; }
    .btn-cancel { background-color: white; color: #555; border: 1px solid #ccc; }
  </style>
</head>
<body>
<div class="kiosco-container">
  <div class="left-banner">
    <img th:src="@{/log.jpeg}" alt="SU Laundry Banner">
  </div>

  <div class="right-content">
    <div class="card">
      <h2>¿Quieres rastrear tu pedido?</h2>
      <p>Ingresa el ID de tu pedido</p>

      <div th:if="${error}" style="color:red; margin-bottom:15px;" th:text="${error}"></div>

      <form action="/kiosco/resultado" method="GET">
        <div class="input-group">
          <span class="input-icon">👜</span>
          <input type="text" name="ordenId" placeholder="ID" required>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn btn-submit">Rastrear tu pedido</button>
          <a href="/kiosco" class="btn btn-cancel">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
